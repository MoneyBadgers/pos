<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Crypto POS" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="apple-touch-startup-image" href="../icon.png" />
  <title>Pay with Cryptocurrency</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #000;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 1.5em;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      text-align: right;
    }

    .mb-1 {
      margin-bottom: 1rem;
    }

    .maincontainer {
      background-color: #000;
      padding: 40px;
      max-width: 480px;
      width: 100%;
    }

    .headerfont {
      color: #fff;
      font-size: 30px;
      line-height: 1.1em;
      font-weight: 600;
    }

    .paybutton {
      background-color: #F7931A;
      color: #fff;
      border-radius: 5px;
      font-size: 25px;
      width: 100%;
      padding: 15px 25px;
      text-align: center;
      cursor: pointer;
    }

    .amountcontainer {
      font-size: 21px;
      color: #fff;
      font-weight: 400;
      line-height: 1.5em;
    }

    iframe {
      width: 400px;
      height: 90vh;
      border: none;
      margin-top: 20px;
    }
  </style>
  <script>
    function setOrderId() {
      const reference = document.getElementById('reference').value || 'order';
      const timestamp = new Date().getTime();
      return `${reference}-${timestamp}`;
    }

    function setAmountCents() {
      const amount = parseFloat(document.getElementById('amount').value || 0);
      return Math.round(amount * 100);
    }

    function openIframePayment() {
      const merchantCode = 'test';
      const amountCents = setAmountCents();
      const description = 'Test Payment';
      const orderId = setOrderId();
      const returnUrl = encodeURIComponent(window.location.href);

      const params = new URLSearchParams({
        merchantCode,
        amountCents,
        description,
        orderId,
        return: returnUrl
      });

      const url = `https://pay.staging.cryptoqr.net/?${params.toString()}`;

      let existingIframe = document.getElementById('paymentIframe');
      if (!existingIframe) {
        existingIframe = document.createElement('iframe');
        existingIframe.id = 'paymentIframe';
        document.getElementById('iframeContainer').appendChild(existingIframe);
      }

      existingIframe.src = url;
      //hide the main container
      document.getElementById('main').style.display = 'none';
    }

    window.onload = function () {
      // Just in case you want to prefill anything on load
    }
  </script>
</head>
<body>
  <div class="maincontainer" id="main">
    <center>
      <div class="headerfont">Pay with<br />Cryptocurrency</div>
      <div class="iconscontainer mb-1">
        <img src="../images/1.png" style="width: 40px;" />
        <img src="../images/2.png" style="width: 40px;" />
        <img src="../images/3.png" style="width: 40px;" />
        <img src="../images/4.png" style="width: 40px;" />
      </div>
      <div class="mb-1">
        <label class="amountcontainer" for="amount">Amount (Rands):</label>
        <input type="number" id="amount" name="amount" placeholder="0" inputmode="decimal" />
        <label class="amountcontainer" for="reference">Reference (Optional):</label>
        <input type="text" id="reference" name="reference" placeholder="order ref" />
      </div>
      <button class="paybutton" onclick="openIframePayment()">
        Pay
      </button>
      <img src="../images/5.png" style="max-width: 220px;" />
    </center>
  </div>
  <div id="iframeContainer"></div>
</body>
</html>
