<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Crypto POS">
    <link rel="icon" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="apple-touch-startup-image" href="/icon.png">
    <title>Pay with Crypto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.5em;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            text-align: right;
        }

        .mb-1 {
            margin-bottom: 1rem;
        }

        #error {
            display: none;
            font-size: 21px;
            color: #fff;
        }

        .maincontainer {
            background-color: #000;
            padding: 40px;
        }

        .headerfont {
            color: #fff;
            font-size: 30px;
            line-height: 1.1em;
            font-weight: 600;
        }

        .paybutton {
            background-color: #F7931A;
            color: #fff;
            border-radius: 5px;
            font-size: 25px;
            width: 100%;
            padding: 15px 25px 15px 25px;
            text-align: center;
        }

        .amountcontainer, .emailcontainer {
            font-size: 21px;
            color: #fff;
            font-weight: 400;
            line-height: 1.5em;
        }
    </style>
    <script>
        function setOrderId() {
            var timestamp = new Date().getTime();
            var device = getQueryParam('device');
            // if deviceId is null or empty, set it to 'order'
            if (!device) {
                device = 'order';
            }
            var orderId = device + '-' + timestamp;
            document.getElementById('orderId').value = orderId;
        }
        function setAmountCents() {
            var amount = document.getElementById('amount').value;
            var amountCents = amount * 100;
            document.getElementById('amountCents').value = amountCents;
        }
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
        function init() {
            document.getElementById('return').value = encodeURIComponent(window.location.href);
            var code = 'sos';
            if (code) {
                document.getElementById('merchantCode').value = code;
            } else {
                document.getElementById('error').style.display = 'block';
                document.getElementById('main').style.display = 'none';
            }
        }
        window.onload = function () {
            init();
        }
    </script>
</head>
<body>
    <div class="container" id="error">
        <h1>Oops!</h1>
        <p>Something went wrong. Please try again or contact support.</p>
    </div>
    <div class="maincontainer" id="main">
        <center>
            <div class="headerfont"> Pay with<br> Cryptocurrency</div>
            <div class="iconscontainer mb-1">
                <img src="/images/3.png" style="width: 40px;">
            </div>
            <div class="mb-1">
                <label class="amountcontainer" for="amount">Amount (Rands):</label>
                <input type="number" id="amount" name="amount" onchange="setAmountCents()" placeholder="0" required>
            </div>
            <form id="payform" action="https://pay.staging.cryptoqr.net/" method="GET" class="mb-1">
                <input type="hidden" id="merchantCode" name="merchantCode" value="">
                <input type="hidden" id="amountCents" name="amountCents" value="25000">
                <input type="hidden" id="description" name="description" value="Crypto Payment">
                <input type="hidden" id="orderId" name="orderId" value="">
                <input type="hidden" id="return" name="return" value="">
                <style>
                    .keypad {
                        width: 100%;
                        table-layout: fixed;
                        margin-bottom: 24px;
                    }
                    .keypad button {
                        width: 100%;
                        padding: 8px;
                        font-size: 24px;
                        color: white;
                        background-color: #000;
                        border: 1px solid #ccc;
                        border-radius: 5px;
                        cursor: pointer;
                        transition: background-color 0.3s;
                    }
                    .keypad button:hover {
                        border: 1px solid #fff;
                        background-color: #333;
                    }
                    .keypad td {
                        padding: 5px;
                    }
                </style>
                <table class="keypad">
                    <tr>
                        <td><button type="button" onclick="appendNumber(1)">1</button></td>
                        <td><button type="button" onclick="appendNumber(2)">2</button></td>
                        <td><button type="button" onclick="appendNumber(3)">3</button></td>
                    </tr>
                    <tr>
                        <td><button type="button" onclick="appendNumber(4)">4</button></td>
                        <td><button type="button" onclick="appendNumber(5)">5</button></td>
                        <td><button type="button" onclick="appendNumber(6)">6</button></td>
                    </tr>
                    <tr>
                        <td><button type="button" onclick="appendNumber(7)">7</button></td>
                        <td><button type="button" onclick="appendNumber(8)">8</button></td>
                        <td><button type="button" onclick="appendNumber(9)">9</button></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><button type="button" onclick="appendNumber(0)">0</button></td>
                        <td><button type="button" onclick="deleteLast()">Del</button></td>
                    </tr>
                </table>
                <script>
                    function appendNumber(number) {
                        var amountField = document.getElementById('amount');
                        amountField.value = amountField.value + number;
                        setAmountCents();
                    }
                    function deleteLast() {
                        var amountField = document.getElementById('amount');
                        amountField.value = amountField.value.slice(0, -1);
                        setAmountCents();
                    }
                </script>
                <button type="submit" class="paybutton" onclick="setAmountCents(); setOrderId(); return true">
                    Pay
                </button>
            </form>
            <img src="/images/5.png" style="max-width: 220px;">
        </center>
    </div>
</body>

</html>
